name: Linux releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # CPU inference needs no CUDA provider downloads.
      ONNXRUNTIME_NODE_INSTALL: skip
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(bun -p 'require("./package.json").version')
          test "$GITHUB_REF_NAME" = "v$version"
      - name: Install verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap curl shellcheck
      - run: bun install --frozen-lockfile
      - run: bun run model:download
      - run: shellcheck install.sh scripts/verify-binary.sh
      - run: bun run check
      - run: bun run build
      - run: bun run verify:binary
      - name: Install and run the built executable
        run: INSTALLER_TEST_BINARY="$PWD/dist/memd" bun test tests/install.test.ts
      - name: Name release artifact
        env:
          RELEASE_ARCH: ${{ matrix.arch }}
        run: mv dist/memd "dist/memd-linux-$RELEASE_ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: memd-linux-${{ matrix.arch }}
          path: dist/memd-linux-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: memd-linux-*
          path: dist
          merge-multiple: true
      - name: Assemble release
        run: |
          test -f dist/memd-linux-x64
          test -f dist/memd-linux-arm64
          cp install.sh dist/install.sh
          cd dist
          sha256sum memd-linux-x64 memd-linux-arm64 install.sh > SHA256SUMS
      - name: Publish verified binaries and installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes \
            "${prerelease[@]}" \
            dist/memd-linux-x64 dist/memd-linux-arm64 dist/SHA256SUMS dist/install.sh
