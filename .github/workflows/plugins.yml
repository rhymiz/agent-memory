name: Plugin releases

on:
  pull_request:
  push:
    branches: [main]
    tags: ["plugin-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: bun test tests/plugin-package.test.ts
      - run: bun run plugin:build
      - name: Check plugin tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(bun -p 'require("./plugins/agent-memory/plugin.json").version')
          test "$GITHUB_REF_NAME" = "plugin-v$version"
      - uses: actions/upload-artifact@v7
        with:
          name: agent-memory-plugin
          path: dist/plugins/*
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/plugin-v')
    needs: package
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: agent-memory-plugin
          path: dist/plugins
      - name: Publish plugin without changing the latest daemon release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist/plugins
          sha256sum --check SHA256SUMS
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "Agent Memory plugin ${GITHUB_REF_NAME#plugin-v}" \
            --generate-notes --latest=false \
            ./*.tar.gz SHA256SUMS
